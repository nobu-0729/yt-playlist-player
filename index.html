<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ovice用 YouTube連続再生URL生成</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424; --border: #2e2e2e;
    --text: #f0f0f0; --muted: #888; --accent: #e8ff5a;
    --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace; --radius: 10px;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .card { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; }
  label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 6px; }
  textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: 12px; padding: 10px 12px; resize: vertical; min-height: 120px; line-height: 1.7; transition: border-color 0.15s; }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea::placeholder { color: #555; }
  .gen-btn { width: 100%; background: var(--accent); border: none; border-radius: var(--radius); color: #111; font-family: var(--font); font-size: 14px; font-weight: 500; padding: 12px; cursor: pointer; transition: opacity 0.15s; }
  .gen-btn:hover { opacity: 0.85; }
  .result { display: none; flex-direction: column; gap: 10px; }
  .result-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .result-url { background: var(--surface2); border: 1px solid var(--accent); border-radius: var(--radius); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 10px 12px; word-break: break-all; line-height: 1.6; }
  .copy-btn { width: 100%; background: var(--accent); border: none; border-radius: var(--radius); color: #111; font-family: var(--font); font-size: 13px; font-weight: 500; padding: 10px; cursor: pointer; transition: opacity 0.15s; }
  .copy-btn:hover { opacity: 0.85; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .hint strong { color: var(--text); }
  .error { font-size: 13px; color: #ff5a5a; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>▶ Ovice用 YouTube連続再生URL</h1>
  <div>
    <label>YouTube URL（1行1本・順番通りに再生）</label>
    <textarea id="input" placeholder="https://youtu.be/...&#10;https://youtu.be/...&#10;https://youtu.be/..."></textarea>
  </div>
  <div class="error" id="error">有効なYouTube URLが見つかりませんでした。</div>
  <button class="gen-btn" onclick="generate()">URLを生成する</button>
  <div class="result" id="result">
    <div class="result-label">OviceのURL欄に貼り付けてください</div>
    <div class="result-url" id="result-url"></div>
    <button class="copy-btn" id="copy-btn" onclick="copyUrl()">コピー</button>
    <div class="hint">
      <strong>使い方：</strong> OviceでYouTubeアイコンをクリック → URL欄にこのURLを貼り付け → 保存
    </div>
  </div>
</div>
<script>
function extractId(url) {
  url = url.trim();
  var p = [/[?&]v=([a-zA-Z0-9_-]{11})/, /youtu\.be\/([a-zA-Z0-9_-]{11})/, /embed\/([a-zA-Z0-9_-]{11})/, /^([a-zA-Z0-9_-]{11})$/];
  for (var i = 0; i < p.length; i++) { var m = url.match(p[i]); if (m) return m[1]; }
  return null;
}
function generate() {
  var raw = document.getElementById('input').value.trim();
  var errEl = document.getElementById('error');
  var resultEl = document.getElementById('result');
  errEl.style.display = 'none';
  resultEl.style.display = 'none';
  var ids = [];
  raw.split(/\n/).forEach(function(l) { var id = extractId(l); if (id && ids.indexOf(id) < 0) ids.push(id); });
  if (!ids.length) { errEl.style.display = 'block'; return; }
  var url = 'https://www.youtube.com/embed/' + ids[0] + '?playlist=' + ids.join(',') + '&autoplay=1&rel=0';
  document.getElementById('result-url').textContent = url;
  resultEl.style.display = 'flex';
}
function copyUrl() {
  var url = document.getElementById('result-url').textContent;
  navigator.clipboard.writeText(url).then(function() {
    var btn = document.getElementById('copy-btn');
    btn.textContent = 'コピーしました！';
    setTimeout(function() { btn.textContent = 'コピー'; }, 2000);
  });
}
</script>
</body>
</html>
